# Publishing switches.  Read by scripts/build_site.py; deliberately NOT part of the pre-registered analysis lock.
site:
  base_path: /melomane/          # served at https://ravjothbrar.com/melomane/ (project Pages under a custom-domain user site)
  max_payload_mb: 50
  # The explorer shows artist/title strings. They come from the Hugging Face dataset seungheondoh/enrich-music4all (Music4All metadata),
  # which declares no licence (DECISIONS.md 18, DATA_LICENSE.md). The owner decided on 2026-10-09 to publish them with attribution
  # (DECISIONS.md 20). Set to false to make build_site refuse to produce a public site again.
  names_cleared: true
