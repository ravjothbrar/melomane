[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melomane"
version = "0.1.0"
description = "Melomane: emergent geometry of music embeddings (music-domain replication of the Epicure papers)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5.0,<1.6.0", "pandas>=2.1", "pyarrow>=15",
  "gensim>=4.3", "umap-learn", "pyyaml>=6", "httpx>=0.27", "jsonschema>=4", "tqdm", "safetensors>=0.4", "matplotlib>=3.8", "tabulate", "zstandard", "truststore>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]
review = ["streamlit>=1.35"]
essentia = ["essentia>=2.1b6.dev1110; platform_system != 'Windows'"]
gpu = []

[project.scripts]
melomane = "melomane.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
